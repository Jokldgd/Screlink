name: screlink-sfu

# ===== SFU 模式（Caddy 反代）：Caddy(入口/自签) + Screlink(信令) + LiveKit(SFU) + coturn =====
# Caddy 在 8787(http)/8788(https 自签) 入口：/livekit -> LiveKit，其余 -> Screlink。
# 主机走 wss://IP:8788/livekit（信任一次自签证书），观看者走 ws://IP:8787/livekit。
# 详见 docs/SFU.md。约 6-8 人以上或更多观看者时使用。
services:
  # Caddy：入口 + TLS(自签) + 反代（WebSocket 久经验证）
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "8787:8787"   # 观看（HTTP）
      - "8788:8788"   # 主机共享（HTTPS 自签）
    volumes:
      - ./deploy/Caddyfile.sfu:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [screlink]

  # Screlink 信令（内网，仅经 Caddy 对外）
  screlink:
    build: .
    restart: unless-stopped
    environment:
      SCRELINK_TURN: "turn:${PUBLIC_IP}:3478?transport=udp,turn:${PUBLIC_IP}:3478?transport=tcp"
      SCRELINK_TURN_USER: "${TURN_USER}"
      SCRELINK_TURN_PASS: "${TURN_PASS}"
      # 同源 /livekit 由 Caddy 路由到 LiveKit；Screlink 自身代理靶（未用）指向 livekit
      LIVEKIT_INTERNAL_URL: "ws://livekit:7880"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
    networks: [screlink]

  # LiveKit SFU（内网；UDP 中继段映射到宿主）
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./deploy/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "50000-50020:50000-50020/udp"
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    networks: [screlink]

  # TURN 中继（NAT 穿透兜底）
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/turnserver.conf:/etc/coturn/turnserver.conf:ro
    entrypoint: >
      /bin/sh -c 'printf "user=%s:%s\n" "${TURN_USER}" "${TURN_PASS}" > /tmp/turnuserdb.conf && chmod 600 /tmp/turnuserdb.conf && exec turnserver -c /etc/coturn/turnserver.conf'
    environment:
      TURN_USER: "${TURN_USER}"
      TURN_PASS: "${TURN_PASS}"

networks:
  screlink:

volumes:
  caddy_data:
  caddy_config:
