# LiveKit 配置（docker 部署）
# 生产环境务必修改 keys 与 coturn 的 static-auth-secret（两者必须一致）
port: 7880

logging:
  level: info

keys:
  devkey: secret

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # docker 部署时建议设为 true 并确保公网 IP 可达（云服务器开启相应安全组）
  use_external_ip: true
  # 如服务器有多网卡/无法自动探测公网 IP，可手动指定：
  # node_ip: "1.2.3.4"

room:
  # 房间空置 60s 自动回收（最后一人离开时的兜底，防服务端漏调 deleteRoom）
  empty_timeout: 60

# TURN（NAT 穿透）——coturn 使用 static-auth-secret 验证 LiveKit 签发的短期凭据
# secret 必须与 coturn/turnserver.conf 中 static-auth-secret 一致
turn:
  enabled: true
  domain: ${DOMAIN:-localhost}
  udp_port: 3478
  tcp_port: 3478
  tls_port: 5349
  # TLS 证书（可选）：放到 deploy/livekit/tls/ 下；无证书时客户端走 UDP/TCP 3478
  # cert_file: /etc/livekit/tls/cert.pem
  # key_file: /etc/livekit/tls/key.pem
