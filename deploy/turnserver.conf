# Screlink TURN（coturn）配置
# docker-compose 会在启动时把 .env 里的 TURN_USER/TURN_PASS 写入 userdb 文件

# 监听端口（浏览器连 turn:DOMAIN:3478）
listening-port=3478
# TLS 端口（可选，需要证书，默认关闭）
# tls-listening-port=5349

fingerprint
lt-cred-mech

# 凭据文件（由 compose 的 entrypoint 生成）
userdb=/etc/coturn/turnuserdb.conf

# realm：TURN 域标识，任意字符串即可
realm=screlink

# 中继端口范围（云防火墙需放行 UDP，见 DEPLOY.md）
min-port=49152
max-port=65535

# 安全加固
no-cli
no-multicast-peers
# 只允许带凭据的客户端，无需开放匿名
