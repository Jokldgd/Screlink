# coturn TURN/STUN 配置
# 关键：use-auth-secret + static-auth-secret 必须与 livekit.yaml 的 API Secret 一致，
#       这样 LiveKit 签发的 TURN 短期凭据才能通过验证。
listening-port=3478
tls-listening-port=5349
realm=localhost
# 允许匿名 STUN 绑定（用于 NAT 探测）
fingerprint
stale-nonce=600
# 短期凭据模式（LiveKit 用 API Secret 做 HMAC 签发）
use-auth-secret
static-auth-secret=secret
lt-cred-mech
# 推荐参数
no-multicast-peers
no-cli
# TLS 证书（可选）
# cert=/etc/coturn/tls/cert.pem
# pkey=/etc/coturn/tls/key.pem
# 日志
log-file=/var/log/turnserver.log
# 公网 IP（host 网络模式下可不设置；若 TURN 无法识别公网 IP 则显式指定）
# external-ip=1.2.3.4
